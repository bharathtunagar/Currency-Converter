<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Convertor</title>
    <link rel="stylesheet" href="style.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.css" integrity="sha512-tx5+1LWHez1QiaXlAyDwzdBTfDjX07GMapQoFTS74wkcPMsI3So0KYmFe6EHZjI8+eSG0ljBlAQc3PQ5BTaZtQ==" crossorigin="anonymous" referrerpolicy="no-referrer"> 
</head>
<body>
    <div class="container">
     <h2>Currency Convertor</h2>
     <form>
         <div class="amount">
        <p>Enter Amount</p>
     <input value="100" type="text"/>
      </div>
     <div class="dropdown">
        <div class="from">
            <p>From</p>
            <div class="select-container">
              <img src="https://flagsapi.com/US/flat/64.png">
              <select name="from">
                <!-- <option value="USD">USD</option>
                <option value="INR">INR</option> -->
              </select>
            </div>
        </div>
        <i class="fa-solid fa-arrow-right-arrow-left"></i>
        <div class="to">
           <p>To</p>
            <div class="select-container">
              <img src="https://flagsapi.com/IN/flat/64.png">
              <select name="to">
                <!-- <option value="USD">USD</option>
                <option value="INR" selected>INR</option> -->
              </select>
            </div>
        </div>
      </div>
      <div class="msg">
        <p>1USD = 80INR</p>
        </div>
        <button>Get Exchange Rate</button>
     </form>
    </div>

    <script src="codes.js"></script>
    <script src="app.js"></script>
</body>
</html>
